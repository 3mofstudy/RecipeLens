[project]
name = "recipe-lens"
version = "0.1.0"
description = "從料理影片產生繁體中文食譜及步驟截圖"
readme = "readme.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "yt-dlp[default]",
    "python-docx",
    "reportlab",
    "markdown-it-py",
    "google-api-python-client",
    "google-auth-oauthlib",
    "filelock",
]

[project.optional-dependencies]
transcription = [
    "faster-whisper",
    # faster-whisper 1.2 uses av.open(metadata_errors=...), removed in PyAV 19.
    "av<19",
]
