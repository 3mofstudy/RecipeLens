<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RecipeLens Google 雲端資料夾</title>
<style>
body { font-family: "Microsoft JhengHei", sans-serif; padding: 24px; color: #202124; }
button { padding: 10px 18px; cursor: pointer; }
</style>
<h1>選擇 Google 雲端硬碟資料夾</h1>
<p id="status">正在載入 Google 官方資料夾選擇器…</p>
<button id="cancel">取消並返回 RecipeLens</button>
<script>
let finished = false;
async function finish(result) {
  if (finished) return;
  const response = await fetch("result", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(result)
  });
  if (!response.ok) throw new Error("無法將選取位置傳回 RecipeLens。");
  finished = true;
  document.getElementById("status").textContent =
    result.action === "picked" ? "已選取資料夾，請返回 RecipeLens 確認上傳格式與檔名。" :
    result.action === "cancel" ? "已取消，請返回 RecipeLens。" : result.message;
  document.getElementById("cancel").hidden = true;
}
document.getElementById("cancel").onclick = () => finish({action: "cancel"});
async function showPicker() {
  try {
    const config = await (await fetch("config", {cache: "no-store"})).json();
    const view = new google.picker.DocsView(google.picker.ViewId.FOLDERS)
      .setIncludeFolders(true)
      .setSelectFolderEnabled(true)
      .setMimeTypes("application/vnd.google-apps.folder")
      .setMode(google.picker.DocsViewMode.LIST);
    const builder = new google.picker.PickerBuilder()
      .setAppId(config.app_id)
      .setOAuthToken(config.access_token)
      .setOrigin(window.location.origin)
      .setTitle("選擇食譜存放資料夾")
      .addView(view)
      .setCallback(data => {
        if (data.action === google.picker.Action.PICKED) {
          finish({action: "picked", folder_id: data.docs[0].id});
        } else if (data.action === google.picker.Action.CANCEL) {
          finish({action: "cancel"});
        }
      });
    const picker = builder.build();
    picker.setVisible(true);
    document.getElementById("status").textContent =
      "請選取資料夾，再按 Google 視窗下方的「選取」。";
  } catch (error) {
    await finish({action: "error", message: String(error.message || error)});
  }
}
function loadPicker() {
  gapi.load("picker", {
    callback: showPicker,
    onerror: () => finish({action: "error", message: "無法載入 Google Picker，請確認網路及 Google Picker API 設定。"})
  });
}
</script>
<script src="https://apis.google.com/js/api.js?onload=loadPicker"
  onerror="finish({action:'error',message:'無法連線 Google Picker。'})"></script>
</html>
